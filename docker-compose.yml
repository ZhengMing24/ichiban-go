services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=change-this-to-a-long-random-string
      - DATABASE_URL=postgres://ichiban:ichiban@postgres:5432/ichibango?sslmode=disable
      - FRONTEND_ORIGIN=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=ichiban
      - POSTGRES_PASSWORD=ichiban
      - POSTGRES_DB=ichibango
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ichiban -d ichibango"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres-data:
